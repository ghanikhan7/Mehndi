<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Alfiya Tamboli – The Mehendi Artist</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f3e9;
      --paper: #fffdf8;
      --ink: #211914;
      --muted: #6e5f53;
      --gold: #c9a45d;
      --gold-deep: #9c7538;
      --wine: #542b24;
      --wine-hover: #361a15;
      --dark: #17120f;
      --line: rgba(84, 43, 36, 0.18);
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #efe4d0 0%, var(--bg) 55%);
      color: var(--ink);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-bar {
      background: var(--dark);
      color: #e8d4a7;
      padding: 12px 20px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(201, 164, 93, 0.3);
    }

    .login-wrap {
      width: min(440px, calc(100% - 32px));
      margin: 40px auto;
    }

    .login-card {
      background: var(--paper);
      border: 1px solid #d8c6a6;
      border-top: 4px solid var(--gold);
      padding: clamp(26px, 5vw, 40px);
      box-shadow: 0 22px 50px rgba(33, 25, 20, 0.1);
    }

    .brand-head {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-head img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      background: #050505;
      object-fit: cover;
      margin: 0 auto 12px;
      display: block;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold-deep);
      font-weight: 600;
    }

    .brand-head h1 {
      font: 500 30px/1.15 var(--serif);
      margin: 6px 0 6px;
      color: var(--ink);
    }

    .brand-head p {
      margin: 0;
      font-size: 13.5px;
      color: var(--muted);
    }

    .form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .field input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #cbbba4;
      background: #fffdf8;
      color: var(--ink);
      font: 400 15px var(--sans);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-wrap input {
      padding-right: 78px;
    }

    .field input:focus {
      border-color: var(--wine);
      box-shadow: 0 0 0 3px rgba(84, 43, 36, 0.1);
    }

    .toggle-pw {
      position: absolute;
      right: 8px;
      height: 34px;
      padding: 0 10px;
      background: #f3eadb;
      border: 1px solid #d9c7a6;
      color: var(--wine);
      font: 600 11px var(--sans);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .toggle-pw:hover {
      background: #e8dac2;
    }

    .alert {
      display: none;
      padding: 11px 13px;
      font-size: 13px;
      line-height: 1.45;
      border: 1px solid #fecdca;
      background: #fef3f2;
      color: #b42318;
    }

    .alert.show {
      display: block;
    }

    .btn {
      width: 100%;
      min-height: 48px;
      padding: 14px 20px;
      background: var(--wine);
      color: #fff8ec;
      border: 1px solid var(--wine);
      font: 600 12px var(--sans);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--wine-hover);
      border-color: var(--wine-hover);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--wine);
      text-decoration: underline;
    }

    .foot {
      text-align: center;
      padding: 18px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="top-bar">Alfiya Tamboli · The Mehendi Artist · Mini CMS Portal</div>

  <main class="login-wrap">
    <section class="login-card" aria-labelledby="loginHeading">
      <div class="brand-head">
        <img src="/images/logo.png" alt="Alfiya Tamboli logo" width="72" height="72">
        <div class="eyebrow">Artist Management Panel</div>
        <h1 id="loginHeading">Admin Sign In</h1>
        <p>Sign in to manage categories, gallery, pricing, enquiries and website settings.</p>
      </div>

      <form class="form" id="loginForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter admin username" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
            <button class="toggle-pw" id="togglePwBtn" type="button" aria-label="Show password">Show</button>
          </div>
        </div>

        <div class="alert" id="loginError" role="alert" aria-live="assertive"></div>

        <button class="btn" id="submitBtn" type="submit">Sign In to Dashboard &nbsp;↗</button>
      </form>

      <a class="back-link" href="/">← Return to Public Website</a>
    </section>
  </main>

  <footer class="foot">© <span id="yr"></span> Alfiya Tamboli – The Mehendi Artist · Powered by AlisTech</footer>

  <script>
    (function () {
      document.getElementById('yr').textContent = new Date().getFullYear();

      const pwInput = document.getElementById('password');
      const togglePwBtn = document.getElementById('togglePwBtn');
      const loginForm = document.getElementById('loginForm');
      const loginError = document.getElementById('loginError');
      const submitBtn = document.getElementById('submitBtn');

      togglePwBtn.addEventListener('click', function () {
        const isPassword = pwInput.type === 'password';
        pwInput.type = isPassword ? 'text' : 'password';
        togglePwBtn.textContent = isPassword ? 'Hide' : 'Show';
        togglePwBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });

      function showError(msg) {
        loginError.textContent = msg;
        loginError.classList.add('show');
      }

      loginForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        loginError.classList.remove('show');

        const username = document.getElementById('username').value.trim();
        const password = pwInput.value;

        if (!username || !password) {
          showError('Please enter both your username and password.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();

          if (!res.ok) {
            showError(data.error || 'Invalid login credentials.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In to Dashboard ↗';
            return;
          }

          window.location.href = '/admin';
        } catch (err) {
          showError('Unable to reach server. Please check your connection and try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In to Dashboard ↗';
        }
      });
    })();
  </script>
</body>
</html>
